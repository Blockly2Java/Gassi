name: Solution Tests
on:
  push:
permissions:
  contents: read
jobs:
  test-solution:
    name: Test solution
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/valentinherrmann/artemis-maven-docker:latest
    steps:
      - name: Derive sub-repo names
        id: repos
        run: |
          EXERCISE="${GITHUB_REPOSITORY##*/}"   # strips 'Org/' prefix
          echo "exercise=${EXERCISE}" >> $GITHUB_OUTPUT
          echo "tests=${GITHUB_REPOSITORY_OWNER}/${EXERCISE}_tests" >> $GITHUB_OUTPUT
          echo "solution=${GITHUB_REPOSITORY_OWNER}/${EXERCISE}_solution" >> $GITHUB_OUTPUT

      - name: Checkout coordinator
        uses: actions/checkout@v4

      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repos.outputs.tests }}
          token: ${{ github.token }}
          path: tests

      - name: Checkout solution
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repos.outputs.solution }}
          token: ${{ github.token }}
          path: solution

      - name: Run solution tests
        working-directory: parent
        run: xvfb-run gradle clean testSolution --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-solution
          path: parent/build/reports/tests/testSolution
          if-no-files-found: ignore