name: Generate Artemis Export

on:
  push:
  workflow_dispatch:
    inputs:
      exercise_title:
        description: 'Exercise Title (e.g., Gassi Migration)'
        required: true
        default: 'My Exercise'
      exercise_short_name:
        description: 'Exercise Short Name (lowercase, no spaces, e.g., myexercise)'
        required: true
        default: 'myexercise'
      exercise_id:
        description: 'Artemis Exercise ID'
        required: true
        default: '1'
      course_prefix:
        description: 'Course/Username prefix for artifact naming (e.g., testmtgherrmann)'
        required: true
        default: 'testmtgherrmann'
      max_points:
        description: 'Maximum points for the exercise'
        required: false
        default: '10.0'
      branch:
        description: 'Branch to checkout for sub-repos (e.g., main, migration)'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  generate-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent repo (assignment)
        uses: actions/checkout@v4
        with:
          path: parent
          fetch-depth: 0

      - name: Checkout template repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.exercise_short_name }}_template
          token: ${{ github.token }}
          path: template
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Checkout solution repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.exercise_short_name }}_solution
          token: ${{ github.token }}
          path: solution
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Checkout tests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.exercise_short_name }}_parent
          token: ${{ github.token }}
          path: tests
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Generate Exercise-Details JSON
        run: python3 .github/scripts/generate-exercise-details.py \
          --title "${{ inputs.exercise_title }}" \
          --short-name "${{ inputs.exercise_short_name }}" \
          --id "${{ inputs.exercise_id }}" \
          --course-prefix "${{ inputs.course_prefix }}" \
          --max-points "${{ inputs.max_points }}" \
          --template-file .github/scripts/exercise-details-template.json \
          --output Exercise-Details-${{ inputs.exercise_short_name }}.json

      - name: Generate Problem Statement Markdown
        run: python3 .github/scripts/generate-problem-statement.py \
          --source template/README.md \
          --output Problem-Statement-${{ inputs.exercise_short_name }}.md

      - name: Create Exercise ZIP (from template repo)
        run: |
          # The exercise ZIP contains the template repo contents
          # This is the student-facing version with stub methods
          cd template
          zip -r "../${{ inputs.exercise_short_name }}-exercise.zip" . \
            -x ".git/objects/*" \
            -x ".git/refs/*" \
            -x ".git/FETCH_HEAD" \
            -x ".git/ORIG_HEAD" \
            -x ".git/logs/*"
          cd ..

      - name: Create Solution ZIP
        run: |
          cd solution
          zip -r "../${{ inputs.exercise_short_name }}-solution.zip" . \
            -x ".git/objects/*" \
            -x ".git/refs/*" \
            -x ".git/FETCH_HEAD" \
            -x ".git/ORIG_HEAD" \
            -x ".git/logs/*"
          cd ..

      - name: Create Tests ZIP
        run: |
          cd tests
          zip -r "../${{ inputs.exercise_short_name }}-tests.zip" . \
            -x ".git/objects/*" \
            -x ".git/refs/*" \
            -x ".git/FETCH_HEAD" \
            -x ".git/ORIG_HEAD" \
            -x ".git/logs/*"
          cd ..

      - name: Package into Artemis Export ZIP
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          OUTPUT_FILE="${{ inputs.course_prefix }}-${{ inputs.exercise_short_name }}-${{ inputs.exercise_id }}-${TIMESTAMP}.zip"
          
          # Create the final ZIP with all components
          zip "$OUTPUT_FILE" \
            Exercise-Details-${{ inputs.exercise_short_name }}.json \
            Problem-Statement-${{ inputs.exercise_short_name }}.md \
            ${{ inputs.exercise_short_name }}-exercise.zip \
            ${{ inputs.exercise_short_name }}-solution.zip \
            ${{ inputs.exercise_short_name }}-tests.zip

      - name: Upload Artemis Export Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-export-${{ inputs.exercise_short_name }}
          path: ${{ inputs.course_prefix }}-${{ inputs.exercise_short_name }}-*.zip
          retention-days: 30