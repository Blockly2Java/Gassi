name: Generate Artemis Export

on:
  workflow_dispatch:
    inputs:
      exercise_title:
        description: 'Exercise Title (e.g., Gassi Migration)'
        required: true
        default: 'My Exercise'
      exercise_short_name:
        description: 'Exercise Short Name (lowercase, no spaces, e.g., myexercise)'
        required: true
        default: 'myexercise'
      exercise_id:
        description: 'Artemis Exercise ID'
        required: true
        default: '1'
      course_prefix:
        description: 'Course/Username prefix for artifact naming (e.g., testmtgherrmann)'
        required: true
        default: 'testmtgherrmann'
      max_points:
        description: 'Maximum points for the exercise'
        required: false
        default: '10.0'
      branch:
        description: 'Branch to checkout for sub-repos (e.g., main, migration)'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  generate-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent repo (contains scripts)
        uses: actions/checkout@v4
        with:
          path: parent
          fetch-depth: 0

      - name: Checkout template repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.exercise_short_name }}-template
          token: ${{ github.token }}
          path: template
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Checkout solution repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.exercise_short_name }}-solution
          token: ${{ github.token }}
          path: solution
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Checkout tests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.exercise_short_name }}-tests
          token: ${{ github.token }}
          path: tests
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Generate Exercise-Details JSON
        run: python3 parent/.github/scripts/generate-exercise-details.py \
          --title "${{ inputs.exercise_title }}" \
          --short-name "${{ inputs.exercise_short_name }}" \
          --id "${{ inputs.exercise_id }}" \
          --course-prefix "${{ inputs.course_prefix }}" \
          --max-points "${{ inputs.max_points }}" \
          --template-file parent/.github/scripts/exercise-details-template.json \
          --output Exercise-Details-${{ inputs.exercise_short_name }}.json

      - name: Generate Problem Statement Markdown
        run: python3 parent/.github/scripts/generate-problem-statement.py \
          --source template/README.md \
          --output Problem-Statement-${{ inputs.exercise_short_name }}.md

      - name: Create ZIP Packages (exercise, solution, tests)
        run: python3 parent/.github/scripts/export-core.py create-zips \
          --short-name "${{ inputs.exercise_short_name }}" \
          --template-dir template \
          --solution-dir solution \
          --tests-dir tests \
          --output-dir .

      - name: Package Final Export ZIP
        run: python3 parent/.github/scripts/export-core.py package-export \
          --short-name "${{ inputs.exercise_short_name }}" \
          --id "${{ inputs.exercise_id }}" \
          --course-prefix "${{ inputs.course_prefix }}" \
          --output-dir .

      - name: Upload Artemis Export Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-export-${{ inputs.exercise_short_name }}
          path: ${{ inputs.course_prefix }}-${{ inputs.exercise_short_name }}-*.zip
          retention-days: 30