name: Generate Artemis Export With Local Script

on:
  workflow_dispatch:
    inputs:
      exercise_short_name:
        description: 'Exercise Short Name (lowercase, no spaces, e.g., gassi)'
        required: true
        default: 'Gassi'
      branch:
        description: 'Branch to checkout for sub-repos (e.g., main, migration)'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  generate-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent repo (contains scripts)
        uses: actions/checkout@v4
        with:
          path: parent
          fetch-depth: 0

      - name: Run local-export.sh
        run: |
          echo "${{ github.event.repository.name }}"
          bash parent/.github/scripts/local-export.sh 
          --name ${{ inputs.exercise_short_name }} 
          --template-branch ${{ inputs.branch }} 
          --solution-branch ${{ inputs.branch }} 
          --parent-branch ${{ inputs.branch }}

      - name: Clean up build artifacts for publishing
        run: |
          echo "=== Artemis_Export Directory Contents ==="
          ls -la Artemis_Export/ || echo "Directory Artemis_Export does not exist in the current path!"

          cd Artemis_Export/
          rm *-solution.zip || echo "No solution zip files to remove"
          rm *-exercise.zip || echo "No exercise zip files to remove"
          rm *-tests.zip || echo "No tests zip files to remove"

          unzip -o ${{inputs.exercise_short_name}}-*-*.zip -d ./
          rm ${{inputs.exercise_short_name}}-*-*.zip

          ls -la


      - name: Upload Artemis Export Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-export-${{ inputs.exercise_short_name }}
          path: Artemis_Export/${{ inputs.exercise_short_name }}-*.zip
          retention-days: 30


