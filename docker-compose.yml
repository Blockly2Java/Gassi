# Simulates Artemis grading environment locally.
# Requires sub-repos to be present (run local-setup.sh first).
# Usage:
#   docker compose run --rm artemis-solution
#   docker compose run --rm artemis-template

version: "3.8"

services:
  artemis-solution:
    image: ghcr.io/valentinherrmann/artemis-maven-docker:latest
    volumes:
      - .:/workspace
      - gradle-cache:/workspace/.gradle
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-~/.Xauthority}:/tmp/.Xauthority:ro
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.Xauthority
      - GRADLE_USER_HOME=/workspace/.gradle
    working_dir: /workspace
    command: gradle clean testSolution

  artemis-template:
    image: ghcr.io/valentinherrmann/artemis-maven-docker:latest
    volumes:
      - .:/workspace
      - gradle-cache:/workspace/.gradle
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-~/.Xauthority}:/tmp/.Xauthority:ro
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.Xauthority
      - GRADLE_USER_HOME=/workspace/.gradle
    working_dir: /workspace
    command: gradle clean testTemplate

volumes:
  gradle-cache:
